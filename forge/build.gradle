plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

publishMods {
    file = remapJar.archiveFile
    displayName = "Terrain Slabs v${project.version}-${rootProject.minecraft_version}"

    changelog = getLatestChangelog()
    type = BETA
    modLoaders.add("forge")

    curseforge {
        projectId = "1125437"
        projectSlug = "countereds-terrain-slabs"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        client = true

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "CurseForge (Forge)"
    }

    modrinth {
        projectId = "SJu6sklj"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "Modrinth (Forge)"
    }
}

loom {
    forge {
        mixinConfig "terrain_slabs.mixins.json"
        mixinConfig "terrain_slabs.forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common, libs
    runtimeClasspath.extendsFrom common, libs
    developmentForge.extendsFrom common, libs

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.4"))

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Midnightlib
    modImplementation include ("eu.midnightdust:midnightlib:${project.midnightlib_version_forge}")

    // MixinExtras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    modImplementation include ("io.github.llamalad7:mixinextras-forge:0.5.4")

    modCompileOnly ("maven.modrinth:embeddium:0.3.30+mc1.20.1")

    // PolyMixin
    modImplementation include ("curse.maven:polymixin-1670134:8744788")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }

    // Merge common resources
    from(project(':common').sourceSets.main.resources)
}

sourceSets {
    main {
        resources {
            srcDir "../common/src/generated"
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
