plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

publishMods {
    file = tasks.named("shadowJar").flatMap { it.archiveFile }
    displayName = file.map { it.asFile.name }

    changelog = getLatestChangelog()
    type = STABLE
    modLoaders.add("fabric")

    curseforge {
        projectId = "1125437"
        projectSlug = "countereds-terrain-slabs"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        client = true

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "CurseForge (Fabric)"
    }

    modrinth {
        projectId = "SJu6sklj"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "Modrinth (Fabric)"
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:${architectury_api_version}"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Midnightlib
    implementation ("eu.midnightdust:midnightlib:${project.midnightlib_version_fabric}")
}

sourceSets {
    main {
        resources.srcDir("../common/src/main/resources")
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''

    archiveFileName = "Terrain Slabs v${project.version}-${rootProject.minecraft_version}.jar"
}


assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

// Fabric Data Generation
fabricApi {
    configureDataGeneration() {
        client = true
        outputDirectory = rootProject.file("common/src/generated")
    }
}