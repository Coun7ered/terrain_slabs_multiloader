plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

publishMods {
    file = remapJar.archiveFile
    displayName = "Terrain Slabs v${project.version}-${rootProject.minecraft_version}"

    changelog = getLatestChangelog()
    type = BETA
    modLoaders.add("fabric")

    curseforge {
        projectId = "1125437"
        projectSlug = "countereds-terrain-slabs"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        client = true

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "CurseForge (Fabric)"
    }

    modrinth {
        projectId = "SJu6sklj"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "Modrinth (Fabric)"
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// We use the Fabric data generation system
fabricApi {
    configureDataGeneration() {
        client = true
        outputDirectory = rootProject.file("common/src/generated")
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Midnightlib
    modImplementation include ("eu.midnightdust:midnightlib:${project.midnightlib_version_fabric}")

    modCompileOnly ("maven.modrinth:sodium:mc1.20.1-0.5.13-fabric")

    // Poly Mixin
    modImplementation include ("curse.maven:polymixin-1670134:8814449")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }

    // Merge common resources
    from(project(':common').sourceSets.main.resources)
}


shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
