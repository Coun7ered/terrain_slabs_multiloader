plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

publishMods {
    file = tasks.named("shadowJar").flatMap { it.archiveFile }
    displayName = file.map { it.asFile.name }

    changelog = getLatestChangelog()
    type = STABLE
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1125437"
        projectSlug = "countereds-terrain-slabs"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        client = true

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "CurseForge (NeoForge)"
    }

    modrinth {
        projectId = "SJu6sklj"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")

        minecraftVersions.add(project.minecraft_version)

        requires("architectury-api")
        requires("midnightlib")

        announcementTitle = "Modrinth (NeoForge)"
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"

    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:${architectury_api_version}"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    implementation("eu.midnightdust:midnightlib:${project.midnightlib_version_neoforge}")
}

sourceSets {
    main {
        resources.srcDir("../common/src/main/resources")
        resources.srcDir("../common/src/generated")
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''

    archiveFileName = "Terrain Slabs v${project.version}-${rootProject.minecraft_version}.jar"
}